name: CI

on:
  # A main se integra por Pull Request; a dev se mergea en local, así que alcanza con el push
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificar formato
        run: npm run format:check

      - name: Generar Prisma Client
        run: npm run prisma:generate -w apps/api
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3000

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fitmanager
          POSTGRES_PASSWORD: fitmanager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitmanager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npm run prisma:generate -w apps/api
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://fitmanager:fitmanager@localhost:5432/fitmanager_test
