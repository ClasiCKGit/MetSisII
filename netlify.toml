# Deploy de la web en Netlify. Detalle en docs/deploy-produccion.md
# Se construye desde la raíz: el monorepo tiene un único package-lock.json.

[build]
  base = "/"
  command = "npm run build -w apps/web"
  publish = "apps/web/dist"
  # Si el commit no toca la web, Netlify no la vuelve a construir
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/web package.json package-lock.json netlify.toml"

[build.environment]
  NODE_VERSION = "22"
  # VITE_API_URL se configura en Netlify (Site configuration → Environment variables):
  # es la URL de la API en Railway, sin barra final

# SPA: cualquier ruta que no sea un archivo la resuelve React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Los archivos de Vite llevan un hash en el nombre: se pueden cachear para siempre
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
